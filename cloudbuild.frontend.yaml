substitutions:
  _SERVICE_NAME: empire1-frontend
  _REGION: us-central1
  _IMAGE_NAME: empire1-frontend

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}', '-f', 'Dockerfile.frontend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/$PROJECT_ID/${_IMAGE_NAME}
      - --region
      - ${_REGION}
      - --set-env-vars
      - BACKEND_URL=https://empire1-backend-339698334666.us-central1.run.app
      - --allow-unauthenticated
images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}'
