steps:
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'https://github.com/shiestybizz113-cell/Empire-1.git', '--branch=sla113', '--single-branch', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/empire1-backend', '-f', 'Dockerfile.backend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/empire1-backend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run'
      - deploy'
      - empire1-backend'
      - '--image'
      - gcr.io/$PROJECT_ID/empire1-backend'
      - '--region'
      - us-central1'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/$PROJECT_ID/empire1-backend'
