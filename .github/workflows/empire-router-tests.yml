name: Empire-1 Router

on:
  pull_request:
    paths:
      - 'backend/app/routers/empire_router.py'
      - 'backend/app/services/empire_router_service.py'
      - 'backend/tests/test_empire_router_service.py'
      - 'scripts/empire'
      - 'scripts/empire-server'
      - 'scripts/install-empire-agents.sh'
      - '.github/workflows/empire-router-tests.yml'
  push:
    branches:
      - agent/empire1-router

jobs:
  router-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'httpx>=0.27,<1' pytest
      - name: Compile Python router and launcher
        run: |
          python -m py_compile backend/app/services/empire_router_service.py
          python -m py_compile backend/app/routers/empire_router.py
          python -m py_compile scripts/empire
      - name: Check shell launchers
        run: |
          sh -n scripts/empire-server
          sh -n scripts/install-empire-agents.sh
      - name: Run router unit tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_empire_router_service.py
