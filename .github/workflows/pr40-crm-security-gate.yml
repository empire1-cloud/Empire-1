name: PR40 CRM Security Gate

on:
  push:
    branches:
      - agent/crm-prospecting-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.104.1 \
            pydantic==2.5.0 \
            pytest==8.3.5 \
            httpx==0.27.2 \
            python-multipart==0.0.6

      - name: Run PR40 security gate
        run: python -m pytest tests/test_crm_pr40_security_gate.py -q
