<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </radialGradient>
    <filter id="magentaGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e6007a" stroke-width="2" opacity="0.4" filter="url(#magentaGlow)"/>

  <!-- Coin circle -->
  <circle cx="100" cy="100" r="90" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="2"/>

  <!-- Inner darker circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.5"/>

  <!-- Greek key pattern border -->
  <g stroke="#8b6914" stroke-width="1.5" fill="none" opacity="0.7">
    <rect x="15" y="15" width="170" height="170" rx="85"/>
    <path d="M 25 100 L 35 100 M 40 100 L 50 100 M 55 100 L 65 100 M 70 100 L 80 100 M 85 100 L 95 100 M 105 100 L 115 100 M 120 100 L 130 100 M 135 100 L 145 100 M 150 100 L 160 100 M 165 100 L 175 100"/>
    <path d="M 100 25 L 100 35 M 100 40 L 100 50 M 100 55 L 100 65 M 100 70 L 100 80 M 100 85 L 100 95 M 100 105 L 100 115 M 100 120 L 100 130 M 100 135 L 100 145 M 100 150 L 100 160 M 100 165 L 100 175"/>
  </g>

  <!-- Aztec Step-Fret Pattern -->
  <g fill="#1a1a1a">
    <!-- Main stepped pattern center -->
    <rect x="70" y="75" width="10" height="10"/>
    <rect x="80" y="75" width="10" height="10" fill="#ffd700"/>
    <rect x="80" y="85" width="10" height="10"/>
    <rect x="70" y="85" width="10" height="10" fill="#ffd700"/>
    <rect x="60" y="85" width="10" height="10"/>
    <rect x="60" y="75" width="10" height="10" fill="#ffd700"/>
    <rect x="60" y="95" width="10" height="10" fill="#ffd700"/>
    <rect x="70" y="95" width="10" height="10"/>
    <rect x="80" y="95" width="10" height="10" fill="#ffd700"/>
    <rect x="90" y="85" width="10" height="10" fill="#ffd700"/>
    <rect x="90" y="75" width="10" height="10"/>
    <rect x="90" y="95" width="10" height="10"/>
    <rect x="50" y="95" width="10" height="10"/>
    <rect x="50" y="85" width="10" height="10" fill="#ffd700"/>
    <rect x="100" y="85" width="10" height="10"/>
    <rect x="100" y="95" width="10" height="10" fill="#ffd700"/>
  </g>
</svg>