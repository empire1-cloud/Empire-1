# Phase 1A — Docker Compose Stack (DEFERRED)
# ⚠️ This stack is for a FUTURE SELF-MANAGED NODE (VPS / Proxmox / dedicated server).
# ⚠️ Do NOT deploy yet — we do not currently have a self-managed infrastructure node.
# ⚠️ All backends run on Railway / GCP Cloud Run / Vercel — see HOSTING_MAP.md
#
# Foundation observability stack for the SLA113 Infrastructure Pack.
# No secrets migration. No domain rewiring. No production code changes.
# All admin ports bind to 127.0.0.1 — no public exposure without auth.

version: "3.9"

volumes:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:

networks:
  sla113-observability:
    driver: bridge

services:

  # ── Uptime Kuma ──────────────────────────────────────────────────────
  # Status: Uptime monitoring for all ecosystem endpoints.
  # Access: http://localhost:3001 (set credentials on first login)
  # Docs:   https://github.com/louislam/uptime-kuma
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: sla113-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - sla113-observability

  # ── Prometheus ────────────────────────────────────────────────────────
  # Status: Metrics collection and time-series database.
  # Access: http://localhost:9090 (no auth — bind to localhost only)
  # Config: ./prometheus.yml
  # Docs:   https://prometheus.io/docs/
  prometheus:
    image: prom/prometheus:latest
    container_name: sla113-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sla113-observability

  # ── Node Exporter ─────────────────────────────────────────────────────
  # Status: Host-level metrics (CPU, memory, disk, network).
  # Access: http://localhost:9100/metrics (no auth — bind to localhost only)
  # Docs:   https://github.com/prometheus/node_exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sla113-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - sla113-observability

  # ── Grafana ───────────────────────────────────────────────────────────
  # Status: Dashboards for all observability data.
  # Access: http://localhost:3000 (admin / CHANGE_ME)
  # Docs:   https://grafana.com/docs/
  grafana:
    image: grafana/grafana:latest
    container_name: sla113-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=CHANGE_ME
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - sla113-observability
    depends_on:
      - prometheus
